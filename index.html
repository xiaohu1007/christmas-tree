<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>圣诞快乐</title>
<meta name="description" content="Three glowing three.js Christmas trees: drawn by starlight, born from pink stardust, and the two combined.">



<style>
  :root {
    --cream: #fff4f0; --ink: #5a2b3c; --pink: #e0457b;
    --f-title: 'ZCOOL KuaiLe', 'LXGW WenKai', 'PingFang SC', sans-serif;
    --f-hand: 'LXGW WenKai', 'Kaiti SC', 'KaiTi', serif;
  }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--cream); color: var(--ink); font: 16px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; display: grid; place-items: center; text-align: center; min-height: 100vh; min-height: 100dvh; }
  main { padding: 32px 16px; width: min(560px, 100%); box-sizing: border-box; }
  h1 { font: 400 clamp(44px, 11vw, 80px)/1 'Great Vibes', cursive; margin: 0 0 6px; }
  .sub { margin: 0 0 22px; opacity: .7; }
  a { color: inherit; }

  /* 小水晶球：里面是最近看的那一版开好灯的树，点它从开灯那里再看一遍 */
  .globe { display: inline-grid; justify-items: center; padding: 0; margin: 0 0 22px; border: 0; background: none; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .globe-ball { position: relative; display: block; width: 132px; height: 132px; border-radius: 50%; overflow: hidden; border: 3px solid var(--ink); background: #1a0f1e; box-shadow: 3px 4px 0 var(--ink); transition: transform .15s; }
  .globe-ball canvas { display: block; width: 100%; height: 100%; }
  .globe-ball::after { content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 30% 24%, rgba(255, 255, 255, .5) 0, rgba(255, 255, 255, .12) 13%, transparent 30%), radial-gradient(circle at 50% 50%, transparent 58%, rgba(255, 255, 255, .14) 72%, transparent 76%); }
  .globe-base { display: block; width: 92px; height: 22px; margin-top: -12px; border: 3px solid var(--ink); border-radius: 9px 9px 14px 14px; background: #e0324b repeating-linear-gradient(90deg, transparent 0 9px, rgba(255, 255, 255, .35) 9px 13px); }
  .globe small { margin-top: 6px; font: 400 13px var(--f-hand); opacity: .6; }
  .globe:active .globe-ball { transform: scale(.95); }
  .globe.pop { animation: pop .7s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: none; opacity: 1; } }

  .picks { display: grid; gap: 12px; }
  .pick { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 14px; text-align: left; font: inherit; color: var(--ink); background: #fff; border: 2.5px solid var(--ink); border-radius: 18px; padding: 14px 18px; box-shadow: 4px 4px 0 var(--ink); cursor: pointer; transition: transform .12s, box-shadow .12s; -webkit-tap-highlight-color: transparent; }
  .pick:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  .pick i { grid-row: span 2; font: 400 26px/1 var(--f-title); font-style: normal; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--pink); }
  .pick b { font: 400 19px/1.3 var(--f-title); }
  .pick span { font-size: 13.5px; line-height: 1.5; opacity: .7; }
  .pick[data-v="a"] i { background: #d9a13b; }
  .pick[data-v="c"] i { background: #2f8f5b; }
  .foot { margin-top: 26px; font-size: 13px; opacity: .7; }

  /* ===== 开场的三层：各自 fixed、直接挂在 body 下：关灯的黑底 → 发光画布（滤色叠加）→ 文字、按钮和漫光 ===== */
  /* 不能包在同一个定位容器里：那样容器自成一组，关灯过程中画布只能和组里那层半透明黑底混合，底下的页面看不到 */
  .xi-glass, .xi-stage, .xi-ui, .xi-fade { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .xi-glass { z-index: 1000; background: rgba(0, 0, 0, 0); }
  .xi-stage { z-index: 1001; mix-blend-mode: screen; }
  .xi-stage canvas { display: block; width: 100%; height: 100%; }
  .xi-ui { z-index: 1002; pointer-events: none; } /* 手势要落到下面的画布上，只有按钮能点 */
  .xi-flood { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .xi-msg { position: absolute; left: 0; right: 0; bottom: calc(max(9vh, 64px) + 44px + env(safe-area-inset-bottom)); text-align: center; color: #ffe9c4; pointer-events: none; opacity: 0; transform: translateY(12px); transition: opacity 2.2s ease, transform 2.2s ease; text-shadow: 0 0 18px rgba(255, 180, 80, .55); }
  .xi-msg.on { opacity: 1; transform: none; }
  .xi-msg b { display: block; font: 400 clamp(42px, 10vw, 76px)/1 'Great Vibes', cursive; }
  .xi-msg span { display: block; margin-top: 10px; font: 400 16px var(--f-title); letter-spacing: .5em; padding-left: .5em; opacity: .8; }
  .xi-hint { position: absolute; left: 0; right: 0; top: calc(26px + env(safe-area-inset-top)); text-align: center; font: 400 14px var(--f-hand); letter-spacing: .2em; color: rgba(255, 235, 205, .6); opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
  .xi-hint.on { opacity: 1; }
  .xi-btn { position: absolute; pointer-events: none; opacity: 0; transition: opacity .8s ease, transform .8s ease; -webkit-tap-highlight-color: transparent; cursor: pointer; }
  .xi-btn.on { opacity: 1; pointer-events: auto; }
  .xi-skip { right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255, 235, 205, .28); background: rgba(255, 255, 255, .06); color: rgba(255, 235, 205, .7); font: 400 13px var(--f-hand); letter-spacing: .15em; }
  .xi-skip:active { background: rgba(255, 255, 255, .14); }
  .xi-enter { left: 50%; bottom: calc(max(4vh, 22px) + env(safe-area-inset-bottom)); transform: translate(-50%, 10px); padding: 11px 30px; border-radius: 999px; border: 1.5px solid rgba(255, 226, 170, .75); background: rgba(255, 210, 140, .12); color: #ffe9c4; font: 400 17px var(--f-title); letter-spacing: .3em; text-indent: .3em; box-shadow: 0 0 22px rgba(255, 190, 90, .35), inset 0 0 12px rgba(255, 210, 140, .18); text-shadow: 0 0 10px rgba(255, 180, 80, .6); white-space: nowrap; }
  .xi-enter.on { transform: translate(-50%, 0); animation: xi-breathe 2.6s ease-in-out 1s infinite; }
  .xi-enter:active { background: rgba(255, 210, 140, .26); }
  @keyframes xi-breathe { 50% { box-shadow: 0 0 32px rgba(255, 190, 90, .55), inset 0 0 14px rgba(255, 210, 140, .26); } }
  .xi-fade { z-index: 1000; pointer-events: none; animation: xi-fade .95s ease-out forwards; }
  @keyframes xi-fade {
    0% { background-color: var(--cream); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
    35% { background-color: color-mix(in srgb, var(--cream) 70%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    100% { background-color: transparent; -webkit-backdrop-filter: blur(0px); backdrop-filter: blur(0px); }
  }
  /* B / C 版：霓虹标题、开场卡片、一个字一个字写出来的信 */
  .xb-neon { font: 400 clamp(46px, 12vw, 84px)/1.15 'Great Vibes', cursive; color: #fff2fa; text-shadow: 0 0 4px #fff, 0 0 12px #ff7cc8, 0 0 28px #ff47ae, 0 0 52px rgba(255, 60, 170, .55); }
  .xb-card { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  .xb-card.on { opacity: 1; pointer-events: auto; transition-duration: 1.2s; }
  .xb-card > span, .xb-title > span { font: 400 12px var(--f-title); letter-spacing: .3em; padding-left: .3em; color: rgba(255, 230, 242, .75); }
  .xb-light { margin-top: 22px; padding: 11px 30px; border-radius: 999px; border: 1px solid rgba(255, 200, 230, .45); background: rgba(255, 255, 255, .07); color: #fff2fa; font: 400 16px var(--f-title); letter-spacing: .3em; text-indent: .3em; box-shadow: 0 0 22px rgba(255, 90, 180, .35), inset 0 0 10px rgba(255, 140, 200, .15); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .xb-light:active { background: rgba(255, 255, 255, .16); }
  .xb-title { position: absolute; left: 0; right: 0; top: calc(14px + env(safe-area-inset-top)); display: grid; justify-items: center; gap: 2px; text-align: center; opacity: 0; transition: opacity 2s ease; pointer-events: none; }
  .xb-title .xb-neon { font-size: clamp(36px, 10vw, 64px); }
  .xb-title.on { opacity: 1; }
  .xb-letter { position: absolute; left: 50%; bottom: calc(max(4vh, 30px) + 58px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(320px, 84vw); text-align: left; font: 400 17px/1.6 var(--f-hand); letter-spacing: .12em; color: #ffe8f4; text-shadow: 0 0 8px rgba(255, 110, 190, .7), 0 1px 3px rgba(0, 0, 0, .8); pointer-events: none; opacity: 0; transition: opacity 1s ease; }
  .xb-letter.on { opacity: 1; }
  .xb-letter p { margin: 0; min-height: 1.6em; }
  .xb-letter p.sign { text-align: right; font-size: 15px; min-height: 1.6em; }
  .xb-pen { display: inline-block; width: 7px; height: 7px; margin-left: 4px; border-radius: 50%; vertical-align: middle; background: #fff; box-shadow: 0 0 6px #fff, 0 0 14px #ffd27a, 0 0 24px #ff9ad0; animation: xb-pen .45s ease-in-out infinite alternate; }
  @keyframes xb-pen { to { transform: scale(.55); opacity: .7; } }
  .xi-ui.xb .xi-hint { top: auto; bottom: calc(6px + env(safe-area-inset-bottom)); font-size: 12px; }
  .xi-ui.xb .xi-enter { bottom: calc(max(4vh, 30px) + env(safe-area-inset-bottom)); border-color: rgba(255, 200, 230, .7); background: rgba(255, 150, 210, .12); color: #fff0f8; box-shadow: 0 0 22px rgba(255, 90, 180, .4), inset 0 0 12px rgba(255, 150, 210, .18); text-shadow: 0 0 10px rgba(255, 110, 190, .7); animation-name: xb-breathe; }
  @keyframes xb-breathe { 50% { box-shadow: 0 0 32px rgba(255, 90, 180, .6), inset 0 0 14px rgba(255, 150, 210, .26); } }
  /* 横屏 / 电脑：树在左边，标题和信在右边 */
  @media (min-aspect-ratio: 23/20) and (min-width: 700px) {
    .xb-title { left: auto; right: 6vw; top: 8vh; width: 40vw; justify-items: start; text-align: left; }
    .xb-letter { left: auto; right: 6vw; top: calc(8vh + 120px); bottom: auto; transform: none; width: min(420px, 36vw); font-size: 22px; }
  }
</style>

<link rel="stylesheet" href="assets/friends.css"></head>
<body>
<main>
  <h1>Starlight Xmas Tree</h1>
  <p class="sub">圣诞快乐</p>
  <button class="globe" type="button" aria-label="从开灯那里再看一遍">
    <span class="globe-ball"></span><span class="globe-base"></span><small>点水晶球再看一遍</small>
  </button>
  <div class="picks">
    <button class="pick" type="button" data-v="a"><i>A</i><b>星光画树</b><span>关灯后一束星光螺旋上升画出轮廓，再一层层点亮彩灯，星星炸开、下雪</span></button>
    <button class="pick" type="button" data-v="b"><i>B</i><b>粉色星尘</b><span>点亮一颗星，炸成漫天星尘，旋转着落成一棵粉色的树；烟花、流星</span></button>
    <button class="pick" type="button" data-v="c"><i>C</i><b>星尘与松枝</b><span>星尘炸开，一束光螺旋画出轮廓，星尘跟着落成绿色的分层树</span></button>
  </div>
  <p class="foot">树亮了以后：拖动旋转 · 双指或滚轮缩放 · B / C 轻点树会散成星系<br><a href="https://github.com/ShmilyXI/starlight-xmas-tree">GitHub</a> · three.js · MIT</p>
</main>
<aside id="panel">
<div class="heading"><div><h2>场景设置</h2></div><button id="collapse" aria-label="收起设置" aria-expanded="true">−</button></div>
<form id="settings">
<section><h3>相册 <span id="albumSize"></span></h3>
<label class="row" for="limit">使用照片 <input id="limit" type="number" min="1" placeholder="全部"></label></section>
<section><h3>树形与装饰</h3><div id="counts"></div><div class="pair" id="size"></div></section>
<section><h3>配色</h3><div id="colors"></div></section>
<footer><button type="reset">恢复默认</button><button class="apply" type="submit">应用设置</button></footer>
</form></aside><div id="finger" hidden></div>

<p id="status" role="status"></p>
<div id="preview" hidden><video muted playsinline></video><canvas width="320" height="240"></canvas></div>
<nav><button id="gesture" disabled>开启手势</button><button id="debug" hidden>显示手部</button><span></span><button id="tree-photos" hidden aria-pressed="true">隐藏树上照片</button><button id="album-toggle" hidden>展开相框</button><button id="fullscreen">全屏观看</button></nav>
<script src="assets/photos.js"></script><script src="assets/photo-gestures.js"></script><script src="assets/controls.js"></script>
<script src="assets/settings.js"></script><script src="assets/friends.js"></script></body></html>
